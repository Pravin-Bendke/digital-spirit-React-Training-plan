<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link rel="stylesheet" href="style/register.css">
</head>
<body>
    
        <form id="userForm">
            <div>
                <label>Full Name</label><br>
                <input type="text" id="name" placeholder="Name" required>
            </div>
             <div>
                <label>Email</label><br>
                <input type="email" id="email" placeholder="Email" required>
            </div>
             <div>
                <label>Contact Number</label><br>
                <input type="text" id="phone" placeholder="Phone" required>
            </div><br>
            <div>
                <label>State</label><br>
                <input type="text" id="state" placeholder="State" required>
            </div><br>
             <div>
                <label>City</label><br>
                <input type="text" id="city" placeholder="City" required>
            </div><br>
            <div>
                <label>Password</label><br>
                <input type="password" id="password1" placeholder="Enter Password" required>
            </div><br>
            <div>
                <label>Comfirm Password</label><br>
                <input type="password" id="password2" placeholder="Enter Comfirm Password" required>
            </div><br>
            <div>
                <label>Department</label><br>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Sales">Sales</option>
                        <option value="Marketing">Marketing</option>
                    </select>
            </div><br>
            <div>
                <label>Blood Group</label><br>
                    <select id="bloodgroup" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
            </div><br>
            <br><br>
            <button id="createUser" type="button" onclick="createUserFun()">submit</button>
        </form>  
    <script src="js/createUser.js"></script>
    <script src="js/visitedPages.js"></script>
    <script>savePageVisit("Add User Page");</script>

</body>
</html>
